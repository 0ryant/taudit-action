name: taudit rollout

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify against baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify new findings
        uses: 0ryant/taudit-action@v1
        with:
          mode: verify
          policy: .taudit/policy/
          paths: .github/workflows/
          include-builtin: true
          baseline-root: .
